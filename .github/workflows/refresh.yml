name: Refresh data and publish

on:
  # Refreshes are started when new data is due by the Supabase function "refresh" (the plan refresh.py publishes:
  # after each session, before lock, until the race's points are certified, daily) and by admins' Refresh now.
  # This timer is only the fallback if that stops (it's at :47, away from the plan's :17 daily run).
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch: # started by the refresh function, or by hand from the Actions tab
  push:
    branches: [main]

# Nothing by default; each job gets only what it needs. The job that runs our code against outside data (refresh)
# can only read the repo; the one that commits the season history runs git and nothing else.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to the commit of a release (the tag is in the comment), so a moved tag can't change what runs.
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      history: ${{ steps.history.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # FastF1: practice laps from F1's live-timing archive when OpenF1 is closed (it locks during live sessions)
      - run: pip install -r requirements.txt
      # esbuild bundles the page's modules (and supabase-js) during the build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # finished gamedays / sessions are cached so each run makes only a handful of requests
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: f1-cache-${{ github.run_id }}
          restore-keys: f1-cache-
      - run: python refresh.py
      # Free Supabase projects (Google sign-in, synced settings) pause after ~1 week idle: a tiny query each run.
      # The key is the public publishable one (it's in the page too). Never fails the build.
      - name: Keep the sign-in database awake
        run: |
          curl -sf -X POST "https://tfljgylwpkpammzsapin.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_5XxT7rr5X-XS1HyduNK1qQ_TfoP2PLV" -H "Content-Type: application/json" -d '{}' \
            || echo "::warning::Supabase ping failed"
      # the season archive, for the history job to commit (before the tests, so a failure never loses archived data)
      - id: history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history
          path: history
          retention-days: 1
      # The tests gate the deploy: engine and optimiser, the price rule and scoring lines against this season's data,
      # saved-settings migrations, the build.
      - name: Tests
        run: |
          node --test
          python -m unittest discover tests
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  # Save the season as it happens: the only job that can write to the repo. Runs even if the tests failed.
  # Pushes made with GITHUB_TOKEN don't trigger another run.
  history:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.history == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: history
          path: history
      - name: Commit season history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if ! git diff --cached --quiet; then
            git commit -m "Season history"
            # a run queued behind another starts from an older commit: on a clash keep this run's (newer) files
            git pull --rebase -X theirs
            git push
          fi

  # Lint, formatting and types on pushes only, in their own job: a style nit never blocks a price refresh.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: pip install ruff && ruff check . && ruff format --check .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
