name: Refresh data and publish

on:
  schedule:
    - cron: "*/30 * * * 4,5,6,0"   # Thu-Sun every 30 min: practice, quali and race updates
    - cron: "17 */6 * * 1,2,3"     # Mon-Wed every 6 h: price changes settle after the race
  workflow_dispatch:                # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # finished gamedays / sessions are cached so each run makes only a handful of requests
      - uses: actions/cache@v4
        with:
          path: cache
          key: f1-cache-${{ github.run_id }}
          restore-keys: f1-cache-
      - run: python refresh.py
      - run: cp build/pit-wall.html build/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
