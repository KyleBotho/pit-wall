name: Refresh data and publish

on:
  schedule:
    - cron: "*/30 * * * 4,5,6,0" # Thu-Sun every 30 min: practice, quali and race updates
    - cron: "17 */6 * * 1,2,3" # Mon-Wed every 6 h: price changes settle after the race
  workflow_dispatch: # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write # commits the season archive (history/)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # current majors (Node 24 runtimes); the v4/v5/v3 set ran on the retiring Node 20
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # finished gamedays / sessions are cached so each run makes only a handful of requests
      - uses: actions/cache@v6
        with:
          path: cache
          key: f1-cache-${{ github.run_id }}
          restore-keys: f1-cache-
      # data/league.sealed.json is pushed here by the private pit-wall-private workflow
      - run: python refresh.py
      # Free Supabase projects (Google sign-in, synced settings) pause after ~1 week idle: a tiny query each run.
      # The key is the public publishable one (it's in the page too). Never fails the build.
      - name: Keep the sign-in database awake
        run: |
          curl -sf -X POST "https://tfljgylwpkpammzsapin.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_5XxT7rr5X-XS1HyduNK1qQ_TfoP2PLV" -H "Content-Type: application/json" -d '{}' \
            || echo "::warning::Supabase ping failed"
      # Save the season as it happens. Pushes made with GITHUB_TOKEN don't trigger another run.
      - name: Commit season history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if ! git diff --cached --quiet; then
            git commit -m "Season history"
            git pull --rebase
            git push
          fi
      # The tests gate the deploy (after the history commit, so a failure never loses archived data): engine and
      # optimiser, the price rule and scoring lines against this season's data, saved-settings migrations, the build.
      - name: Tests
        run: |
          node --test
          python -m unittest discover tests
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  # Lint, formatting and types on pushes only, in their own job: a style nit never blocks a price refresh.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: pip install ruff && ruff check . && ruff format --check .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
