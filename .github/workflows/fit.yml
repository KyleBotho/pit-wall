name: Weekly settings fit

# The model's settings fitted again on this season's rounds (backtest/fit.js, walk-forward CRPS), saved as a proposal
# in history/<season>/fit.json for the Sim lab's Model health panel. Nothing changes in the model by itself: the
# owner decides, and an adopted change goes into engine.js by hand.
on:
  schedule:
    - cron: "30 3 * * 2" # Tuesday 03:30 UTC: after a race weekend's points are certified
  workflow_dispatch:

permissions: {}

concurrency:
  group: fit
  cancel-in-progress: false

jobs:
  # runs our code on the season's data: can only read the repo
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # the latest build's data (cache/data.json), saved by the refresh workflow
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: f1-cache-none
          restore-keys: f1-cache-
      - run: node backtest/fit.js --save
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fit
          path: history/*/fit.json
          retention-days: 1

  # the only job that can write: commits the proposal
  save:
    needs: fit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fit
          path: history
      - name: Commit the proposal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if ! git diff --cached --quiet; then
            git commit -m "Weekly settings fit"
            git pull --rebase -X theirs
            git push
          fi
